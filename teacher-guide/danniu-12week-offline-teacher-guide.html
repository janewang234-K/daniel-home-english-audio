function init(){weeks.forEach((w,i)=>{const b=document.createElement('button');b.className='week-card';b.type='button';const icon=weekIcons[i].startsWith('assets/')?`<img class="week-icon" src="${weekIcons[i]}" alt="">`:`<span class="week-icon text" aria-hidden="true">${weekIcons[i]}</span>`;b.innerHTML=`${icon}<small>Week ${i+1}</small><strong>${w.theme}</strong><span>${w.cn}</span>`;b.onclick=()=>render(i);grid.appendChild(b)});tabs.forEach(t=>{const b=document.createElement('button');b.className='teacher-tab';b.type='button';b.dataset.tab=t[0];b.innerHTML=`${t[1]?`<span>${t[1]}</span>`:''}${t[2]}`;b.onclick=()=>{activeTab=t[0];drawSlots()};tabWrap.appendChild(b)});document.getElementById('nextWeek').onclick=()=>render((current+1)%weeks.length);document.getElementById('printActive').onclick=printCurrent;render(current)}
function render(i){current=i;document.querySelectorAll('.week-card').forEach((b,n)=>b.classList.toggle('active',n===i));const w=weeks[i];document.getElementById('activeKicker').textContent=`Week ${i+1}`;document.getElementById('activeTitle').textContent=`${w.theme} / ${w.cn}`;document.getElementById('activeDesc').textContent=w.brief;drawSlots()}
function drawSlots(){document.querySelectorAll('.teacher-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));const w=weeks[current];slots.innerHTML=tabs.map(t=>`<section class="active-slot ${t[0]===activeTab?'is-active':''}" data-tab="${t[0]}"><h3 class="active-slot-title">${t[2]}</h3>${renderTab(t[0],w,current)}</section>`).join('')}
function renderTab(tab,w,i){if(tab==='script')return script(w,i);if(tab==='talk')return teacherTalk(w,i);if(tab==='ritual')return ritualSongs();if(tab==='rules')return classroomRules();if(tab==='prep')return prep(w,i);if(tab==='classsize')return classSize(w);if(tab==='stage')return stage(w);if(tab==='game')return games(w,i);if(tab==='gamebank')return gameBank();if(tab==='materials')return materials(w);if(tab==='flashcards')return flashcards(w);if(tab==='resource')return resourceMatch(w,i);if(tab==='tpr')return tpr(w);if(tab==='feedback')return feedback(w,i);return ''}
function script(w,i){const listenTeacher=i===0?`老师把 mum、dad、brother、sister、baby 家庭成员手指偶戴在手上。播放 ${w.song} 的熟悉片段：第一遍让对应手指偶随歌词依次“探头”并做动作；第二遍在角色关键词前停顿，让孩子寻找正确的手指偶。`:`播放 ${w.song} 的熟悉片段，第一遍做动作，第二遍在关键词处停顿。`;const listenChild=i===0?'看向、指一指或轻碰对应的手指偶；跟做动作，或补出 mum / dad 等关键词。':'动作、指认或补一个关键词。';return `<div class="board"><div class="card"><b>本周唯一主目标</b><strong>${w.tag}</strong><p>${w.focus}</p><ul class="list"><li>资源包精听：${w.song}</li><li>资源包精读：${w.reading}</li><li>核心句框：${w.phrases.join(' / ')}</li><li>可观察达成：${w.assessment}</li></ul></div><div class="card"><b>标准50分钟执行流程</b><table class="flow-table"><thead><tr><th>时间</th><th>环节</th><th>老师具体做什么</th><th>孩子有效回应</th></tr></thead><tbody>${[['0-4','Greeting Song',`坐成半圆，老师按示范录音清唱 Hello 点名歌；唱到名字时与该孩子挥手或击掌。`,'听到自己名字后挥手、拍腿或回应 Hello。'],['4-10','资源包精听唤醒',listenTeacher,listenChild],['10-17','资源包精读回看',`只看 ${w.reading} 的3-5个关键画面；用本周问题和句框，不重新逐页讲。`,'找图、排序、二选一或说关键词。'],['17-29','Activity 1 · 理解与操作',w.station1,'在真实任务中听懂并选择。'],['29-39','Activity 2 · 互动与输出',w.station2,'轮流、请求、回答或合作。'],['39-46','Final Mission · 小小演说家',`${w.outdoor}<br><b>展示方法：</b>每人拿一件实物、图片或作品，站到“小脚印”上。老师说 Ready? Show us. 必要时指着图片轻声带第一句。`,`<b>本周句型：</b>${miniSpeakerLines[w.theme]}<br><small>3岁：指图＋关键词；4岁：选择其中1句；5岁：尝试连续2-3句。允许老师提示，以自然表达为准。</small>`],['46-50','Goodbye Song＋离场',`边收教具边按同一旋律清唱 Goodbye 点名歌；同时完成观察记录：${w.assessment}`,'听到自己名字后挥手并回应 Goodbye，知道课堂完整结束。']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div><div class="support-strip"><div class="support-mini"><b>时间不够</b>Greeting Song 和 Goodbye Song 仍保留；缩短 Activity 2。</div><div class="support-mini"><b>孩子不开口</b>先让他指、拿、贴；老师替他扩成完整句。</div><div class="support-mini"><b>小小演说家</b>每人约20-30秒；先展示教具，再说1-2句，不逐个纠音。</div><div class="support-mini"><b>拍摄原则</b>只拍自然任务中最成功的10-20秒，不重拍到孩子疲惫。</div></div>`}
function ritualSongs(){return `<div class="ritual-grid"><article class="ritual-card hello"><b>0-4 MIN · GREETING SONG</b><h3>用名字把孩子接进课堂</h3><div class="ritual-lyrics"><em>Hello [name].</em><br>Hello [name].<br>Hello [name].<br>Hello everyone.</div><div class="ritual-actions"><div><span>👋</span>唱到名字时看向孩子并挥手</div><div><span>🦵</span>轻拍膝盖跟随节拍</div><div><span>🤲</span>everyone 时双手打开</div><div><span>😊</span>唱完进入本周主题导入</div></div></article><article class="ritual-card bye"><b>46-50 MIN · GOODBYE SONG</b><h3>使用同一旋律，只替换问候词</h3><div class="ritual-lyrics"><em>Goodbye [name].</em><br>Goodbye [name].<br>Goodbye [name].<br>Goodbye everyone.</div><div class="ritual-actions"><div><span>👋</span>唱到名字时看向孩子并挥手</div><div><span>🦵</span>轻拍膝盖保持同一节拍</div><div><span>🤲</span>everyone 时面向全班</div><div><span>🚪</span>唱完进入离场流程</div></div></article></div><div class="tune-box"><b>GREETING / GOODBYE 共用旋律</b><div class="tune-notes">Hello [name] × 3　→　Hello everyone<br>Goodbye [name] × 3 →　Goodbye everyone</div><div style="margin-top:10px"><audio controls preload="metadata" src="greeting-goodbye-piano.wav" style="width:100%">当前浏览器不支持音频播放。</audio></div></div><div class="prep-grid" style="margin-top:12px"><div class="prep-card"><b>1-4名孩子</b><strong>每个名字唱一次</strong><p>先依次唱实际到场孩子的名字；三个姓名位置没有唱满时，用 Hello everyone 或 Goodbye everyone 补足并重复，最后一句仍唱 everyone。</p></div><div class="prep-card"><b>5-10名孩子</b><strong>每轮三个名字</strong><p>每轮依次唱三个孩子的名字，再唱 Hello everyone；下一轮换另外三个名字。全段控制在2-3分钟。</p></div><div class="prep-card warn wide"><b>固定规则</b><p>每周使用同一旋律、同一站位、同一组动作。Greeting Song 之后立刻进入本周主题导入；Goodbye Song 使用同一旋律，把 Hello 换成 Goodbye。唱完后再发贴纸、穿鞋或离场。</p></div></div>`}
function classroomRules(){return `<div class="prep-grid"><div class="prep-card wide"><b>CLASSROOM RULES · 只保留4条</b><strong>用图标、动作和固定短句建立课堂边界</strong><div class="visual-rule"><div><b>👀 Looking eyes</b>手指眼睛，看向老师或教具。</div><div><b>👂 Listening ears</b>手放耳边，暂停说话听指令。</div><div><b>🤲 Kind hands</b>双手轻放，不抢、不推。</div><div><b>👣 Walking feet</b>教室内慢走，不追跑。</div></div><p style="margin-top:10px">第一节课用手偶逐条示范；以后每节课只需在 Greeting Song 后用20秒复习。规则说完马上让孩子做一次，不要求认读文字。</p></div><div class="prep-card"><b>全班注意力口令</b><strong>Teacher: Eyes on me.</strong><p><b>Children:</b> Eyes on you.<br>老师指自己眼睛，孩子回应后看向老师。只说一遍并等待，不连续喊叫。</p></div><div class="prep-card"><b>坐稳准备口令</b><strong>Hands on knees. Ready?</strong><p><b>Children:</b> Ready!<br>老师先把手放在膝盖上示范；孩子做到后立刻开始下一条指令。</p></div><div class="prep-card"><b>活动暂停口令</b><strong>One, two, three—freeze!</strong><p>孩子停手、身体不动。老师具体表扬：I can see Linda is ready. Thank you.</p></div><div class="prep-card"><b>收纳转场口令</b><strong>One, two, three—clean up with me.</strong><p>边说边示范第一件物品放回哪里。收好后接：Hands on knees. Eyes on me.</p></div><div class="prep-card warn wide"><b>孩子暂时不配合时</b><p>先靠近、蹲低、轻声给一个指令，再等待3秒：<b>Hands on knees.</b> 如果仍未回应，给二选一：<b>Sit here or sit next to me?</b> 不隔空反复喊名字，不用长篇中文说教，也不以取消活动相威胁。</p></div></div>`}
function gameBank(){const bank=[
['⭕','Ring Toss · 套圈','颜色、数字、动物、交通','大号软圈＋图片立柱','孩子先听或说目标词，再把软圈套向对应图片。套中后说 It is... / I see...。','投掷线距离约1米；不计淘汰，只记录全班共同完成几个。'],
['🫏','Pin the Tail · 贴尾巴','动物、身体部位、方位','大型动物底板＋可移胶尾巴','老师说 Find the tail. 孩子拿尾巴走到图前贴上；不蒙眼时说 This is the tail，熟悉后可闭眼由同伴用 left / right 提示。','3岁不蒙眼；不旋转孩子；一次只允许一人靠近墙面。'],
['🎯','Beanbag Toss · 豆袋投图','所有主题词汇','软豆袋＋4-6张大图地垫','老师问 Where is the bus? 孩子说或指认后投向对应图；捡回时再说一次。','大图间留空；规定同一投掷线，其他孩子坐在线后。'],
['👜','Mystery Bag · 神秘袋','颜色、形状、玩具、食物','不透明袋＋安全实物','孩子先摸不看，老师问 What is it? 孩子猜或二选一；取出后完成 It is...。','每轮只放3-5件；物品需大于孩子口部、无尖角。'],
['🪄','Magic Reveal · 魔术变变变','颜色、动物、家庭成员','遮挡布／信封翻翻卡＋图片','老师逐渐露出图片，孩子说 Stop! 并猜；完整揭晓后说 I see...。','用停顿制造悬念，不把“喊得最大声”作为获胜标准。'],
['🧸','Pass the Puppet · 传手偶','问候、情绪、家庭、玩具','主题手偶＋轻音乐','围坐传手偶，音乐停时拿到手偶的孩子指图、说一个词或回答一个短问题。','老师控制音乐，避免抢夺；允许孩子把手偶交给老师代答。'],
['👣','Picture Hunt · 图片寻宝','颜色、形状、家、交通','4-6张大图片＋小篮子','图片放在教室低处。老师说 Find something blue / Find the kitchen，孩子找到后带回或贴到板上。','不做竞速；使用 walking feet；一次只找一种。'],
['🙈',"What's Missing? · 什么不见了",'所有主题复习','3-5件实物或图片＋遮挡布','共同命名物品后闭眼，老师拿走一件。孩子睁眼猜 What’s missing? 并指空位。','从3件开始；识字前只用实物或图片，不用英文词卡。'],
['👂','Teacher Says · 听指令做动作','身体、动物、动作、课堂规则','动作图片（可选）','只有听到 Teacher says 才做动作：Touch your nose / Jump like a rabbit。熟悉后让孩子当小老师。','不淘汰做错的孩子；老师直接再次示范。'],
['🎳','Picture Bowling · 图片保龄球','数字、颜色、动物、食物','软球＋纸杯／塑料瓶图片柱','孩子先选择目标并说 Red, please / I want the apple，再滚球击倒对应图片柱。','只能滚球不能抛球；使用轻软球，瓶柱远离玻璃和设备。'],
['🐻','Feed the Puppet · 喂一喂','食物、颜色、数量、形状','大嘴纸箱手偶＋图片食物','手偶提出请求 I want two apples. 孩子选择正确图片投入嘴中，再说 Here you are。','投入口足够大，不使用可入口小物；每人都有一次任务。'],
['🏝️','Picture Corners · 图片角落','喜好、天气、动物、交通','四张主题大图＋角落地贴','四角放图片，老师问 What do you like? / How do you go? 孩子走到自己的选择并说关键词或 I like...。','只走不跑；没有标准答案，保留真实选择。'],
['☝️','Fast Finger · 快手指','所有主题的听辨与复习','4-6张大图闪卡＋白板磁贴','闪卡横向排好，老师的手指缓慢移动并说 Say stop at the...；孩子看到目标图就喊 Stop，再一起说出词或短句。','幼儿够不到白板时由老师移动手指；不比谁喊得响。'],
['🧊','Listen, Do & Freeze · 听做定格','身体、动物、情绪、交通','动作图片＋音乐（可选）','老师说 Fly like a bird / Drive a bus，孩子边做边说关键词；听到 Freeze 立刻定格。熟悉后由孩子抽图发指令。','每轮30-60秒后安排坐下观察；不淘汰最后停下的孩子。'],
['🪜','Picture Path · 图片小路','所有主题词汇与句型','6-10张防滑大图＋起终点地贴','把图片铺成小路。孩子每走到一张图就听指令、说词或完成一句；最后把一张图交给手偶。','卡片用防滑胶固定，间距适合小步走；一人走、其他人做观众任务。'],
['⭕','Musical Hoops · 音乐圆圈','数字、颜色、动物、天气','2-4个呼啦圈＋每圈主题图片＋音乐','孩子绕圈慢走，音乐停后进入附近圆圈；老师问 What can you see?，圈内孩子共同说图中内容或做动作。','呼啦圈平放并留足间距；不是抢圈游戏，每个圈可站多人。'],
['🤖','Puppet Makes a Mistake · 手偶说错了','所有主题的理解检查','主题手偶＋3-5张图片或实物','手偶故意把 blue 说成 red，或把 bus 放进 water。孩子说 No，再指出或说正确答案；老师扩成 Yes, it is blue。','错误要明显且一次一个；不要求孩子纠正同伴，只帮助手偶。'],
['📦','Listen & Deliver · 听令送货','家庭、食物、玩具、房间、交通','图片／实物＋2-4个场景篮','老师给一条短指令 Put the teddy in the bedroom / Give Mum two apples，孩子取物并送到正确位置；完成后复述关键词。','先一条信息，熟悉后再加颜色或数量；不竞速。'],
['🔊','Echo Voice · 回声声音','关键词、短句、语音节奏','手偶或纸筒麦克风','老师用大声、小声、慢声或机器人声说目标语，孩子回声模仿；随后孩子选择一种声音带全班说。','每次只练3-4个词或1个短句；保护音量，不连续尖叫。'],
['🧠','Odd One Out · 谁不一样','动物、食物、形状、天气、交通','每组3张大图，其中1张明显不同','老师摆出 dog, cat, bus，问 Which one is different? 孩子指图并说 bus；4-5岁可加 It is not an animal。','先用视觉差异很大的组合；答案合理即可，不追求唯一解释。'],
['🎭','Story Sequence · 故事排排队','绘本回看、动作顺序、三明治、天气','3-5张无字关键画面卡','老师先演一遍，再把画面打乱。孩子合作排 first-next-last，并各拿一张按顺序说关键词、动作句块或目标短句。','3岁只排2-3张；根据无字画面说关键词、动作句块或目标短句。']
];return `<div class="prep-card warn" style="margin-bottom:10px"><b>成熟幼儿课堂活动的共同原则</b><strong>3-5分钟一轮 · 先完整示范 · 图片和实物优先 · 不做淘汰制</strong><p>共21个备用游戏。同一个游戏连续使用2-3周，只替换主题图片，孩子熟悉规则后才更容易把注意力放到英语上。3岁以指、拿、贴、投、走、做为成功；4-5岁再加一个短句。老师按课堂状态选择：需要动一动用 Listen, Do & Freeze / Picture Path；需要安静聚焦用 Fast Finger / What’s Missing；需要真实输出用 Listen & Deliver / Puppet Makes a Mistake。</p></div><div class="game-list">${bank.map(g=>`<div class="game-card"><b>${g[0]} ${g[1]}</b><strong>适用：${g[2]}</strong><p><b>教具：</b>${g[3]}<br><b>玩法：</b>${g[4]}<br><b>安全与控场：</b>${g[5]}</p></div>`).join('')}</div><div class="source-note"><b>教研依据：</b>玩法经 <a href="https://www.teachingenglish.org.uk/teaching-resources/teaching-primary/activities/level-1/using-flashcards" target="_blank" rel="noopener">British Council TeachingEnglish 图片卡活动</a>、<a href="https://www.teachingenglish.org.uk/sites/teacheng/files/pub_English%20learning%20areas%20in%20pre-primary%20classrooms.pdf" target="_blank" rel="noopener">学前英语游戏指南</a>、<a href="https://www.cambridge.org/elt/blog/2021/03/01/using-stirrers-and-settlers-with-young-learners/" target="_blank" rel="noopener">Cambridge 的 Stirrer / Settler 原则</a>和 <a href="https://www.naeyc.org/resources/blog/fostering-preschool-childrens-spatial-thinking-books-and-movement" target="_blank" rel="noopener">NAEYC 绘本＋动作建议</a>核对；在此基础上改写为本课程3-5岁、识图阶段、非淘汰式的课堂版本。</div>`}
function prep(w,i){const items=[`设备已打开并定位到 ${w.song} 的需要片段`,`把 ${w.reading} 标出3-5个关键画面`,`准备本周故事袋：手偶＋角色剪件＋场景底板＋真实物`,`孩子操作件正面只有大图，英文提示只写在背面给老师看`,`材料分成 Activity 1 / Activity 2 / Final Mission 三篮`,`手机只用于最后成果记录，提前调成静音`];return `<div class="prep-grid"><div class="prep-card"><b>0-5 MIN · 先明确目标</b><strong>${w.focus}</strong><p>今天不追求“全部会说”。老师只观察：${w.assessment}</p></div><div class="prep-card"><b>5-10 MIN · 摆场地</b><strong>${w.setup}</strong><p>活动材料放在孩子看得见但暂时拿不到的位置；小零件按人数分盒，避免等待和争抢。</p></div><div class="prep-card wide"><b>10-15 MIN · 开课检查</b><div class="check-grid">${items.map(x=>`<label class="check-row"><input type="checkbox">${x}</label>`).join('')}</div></div><div class="prep-card warn"><b>安全提醒</b><strong>先检查，再开课</strong><p>剪件建议手掌大小、圆角、厚卡覆膜；小零件不用于仍有口欲的孩子；真实食物先核对过敏；喷壶、剪刀和胶带由成人控制；户外任务始终设边界。</p></div><div class="prep-card"><b>新老师口袋卡</b><strong>一句指令 → 等3秒 → 手偶或动作示范</strong><p>孩子看对、指对、拿对、放对、演对都属于理解。先认可成功，再替孩子扩句；不要求识读英文词卡。</p></div></div>`}
function teacherTalk(w,i){const p=w.phrases;return `<div class="script-stack"><div class="script-callout"><b>1 · GREETING SONG / 点名开场</b>Hello [name].<br>Hello [name].<br>Hello [name].<br>Hello everyone.<small>按美音示范清唱，把 [name] 依次换成当班孩子的名字；唱到谁就看向谁并挥手。孩子只需挥手、看老师或回应 Hello。</small></div><div class="script-callout"><b>2 · HOOK / 手偶或实物导入</b>Hello! Look what I brought today. What can you see? You can point.<small>Greeting Song 唱完立刻让本周手偶或故事袋出现；先让孩子靠近、看、摸和猜，不先展示文字。</small></div><div class="script-callout"><b>3 · LISTEN / 精听唤醒</b>Listen first. Ready? Show me with your body. I hear “${w.words[0]}”. Can you find it?<small>第一遍只动作；第二遍才暂停找词。歌曲不要逐句翻译。</small></div><div class="script-callout"><b>4 · READ / 精读回看</b>Let’s look again. What can you see? Is it ${w.words[0]} or ${w.words[1]}? Show me.<small>先二选一，再开放问答；只选资源包绘本的关键画面。</small></div><div class="script-callout"><b>5 · MODEL / 任务示范</b>Watch me. ${p[0]} Now you try. You can point, say one word, or say the whole sentence.<small>老师先用教具完整做一遍，示范“动作＋语言＋结束位置”。</small></div><div class="script-callout"><b>6 · PROMPT / 提示阶梯</b>Look here → Show me → ${w.words[0]} or ${w.words[1]}? → Say “${p[0]}”.<small>从最少帮助开始；一旦成功就停止加提示。</small></div><div class="script-callout"><b>7 · TRANSITION / 转场</b>Freeze. Hands on knees. One, two, three—clean up with me. Now let’s move to the next activity.<small>固定使用同一组转场语，配手势和地贴路线。</small></div><div class="script-callout"><b>8 · PRAISE / 有信息的表扬</b>You listened and found it. / You waited for your turn. / You used the sentence by yourself.<small>具体说出孩子做到了什么，少用空泛的 Good job。</small></div><div class="script-callout"><b>9 · MINI SPEAKER & GOODBYE / 展示收尾</b>Show time! ${miniSpeakerLines[w.theme]}<br>Goodbye [name].<br>Goodbye [name].<br>Goodbye [name].<br>Goodbye everyone.<small>先完成20-30秒小小演说家，再用与开场相同的旋律唱 Goodbye；依次换成当班孩子姓名。害羞孩子可指图、拿教具或与老师合说。</small></div></div>`}
function resourceMatch(w,i){return `<div class="prep-grid"><div class="prep-card wide"><b>资源包对应检查</b><table class="resource-table"><thead><tr><th>课堂环节</th><th>本周准确资源</th><th>线下课怎么复习</th></tr></thead><tbody><tr><td>精听唤醒</td><td>${w.song}</td><td>只用熟悉片段做动作、停顿补词和找物，不重新教完整歌曲。</td></tr><tr><td>精读回看</td><td>${w.reading}</td><td>选3-5个关键画面，用手偶和剪件做预测、找图、摆放和顺序复述。</td></tr><tr><td>核心词汇<br><small>仅供老师</small></td><td>${w.words.join(' · ')}</td><td>孩子端使用4-6个大图、实物或角色件，不向孩子展示英文认读卡。</td></tr><tr><td>核心句框<br><small>仅供老师</small></td><td>${w.phrases.join('<br>')}</td><td>老师借手偶完整示范；孩子可按“看/拿/演—单词—短句”三个层级回应。</td></tr></tbody></table></div><div class="prep-card"><b>前面内容怎样回来</b><strong>螺旋复习 1</strong><p>${w.review1}</p></div><div class="prep-card"><b>本周怎样多走一步</b><strong>螺旋复习 2</strong><p>${w.review2}</p></div><div class="prep-card warn wide"><b>使用边界</b><p>商业歌曲和绘本只做课程书目与课堂使用提示。教师使用机构已购买或合法授权的版本；不从本页下载、复制或分发完整音视频、绘本内页、角色图和歌词。正式剪件优先使用课程自有形象或已授权插图。</p></div></div>`}
function classSize(w){return `<div class="size-grid"><div class="size-card"><b>1-2名学员</b><strong>多轮深挖</strong><ul class="list"><li>每个任务玩2-3轮：老师示范 → 孩子选择 → 孩子带领。</li><li>老师做同伴角色，增加真实问答。</li><li>成果可分段拍，不要求一次说完。</li></ul></div><div class="size-card"><b>3-6名学员</b><strong>两个Activity轮换</strong><ul class="list"><li>一半完成 Activity 1：${w.station1.split('：')[0]}，一半完成 Activity 2：${w.station2.split('：')[0]}。</li><li>等待者承担拿卡、计分或观众猜测任务。</li><li>每轮5-7分钟，铃声后交换活动。</li></ul></div><div class="size-card"><b>7-10名学员</b><strong>三组并行</strong><ul class="list"><li>分为教师带领组、同伴练习组和安静操作组。</li><li>教师带领组练句框；其他组做已示范过的配对或操作。</li><li>每组配颜色标识和材料篮，避免全班同时抢教具。</li></ul></div><div class="size-card"><b>混龄 / 程度差异</b><strong>同任务，不同出口</strong><ul class="list"><li>Level 1：指、拿、贴、做动作。</li><li>Level 2：说关键词或二词组合。</li><li>Level 3：用 ${w.phrases[0]} 或完整句互动。</li></ul></div><div class="size-card full"><b>现场应急</b><p><b>孩子拒绝：</b>允许先做助手或替玩偶回答。　<b>设备故障：</b>老师用动作、节奏和关键词完成精听唤醒。　<b>情绪过载：</b>进入安静角，保留观察权，不用参与换奖励。　<b>时间落后：</b>跳过 Activity 2，直接进入 Final Mission。</p></div></div>`}
function stage(w){return `<div class="board"><div class="stage-card"><b>Mini Speaker · 小小演说家</b><strong>${w.tag}</strong><p>小舞台重在真实展示和自然表达。孩子拿真实物品、照片或作品上台，展示后说适合自己的一小句。</p><ul class="list"><li>展示物：${w.bring}</li><li>本周句型：${miniSpeakerLines[w.theme]}</li></ul></div><div class="stage-card"><b>Teacher & Child Script</b><div class="stage-script"><div class="stage-line"><span>Teacher</span>Ready? Show us.<br>What is it?<br>Great speaking!</div><div class="stage-line"><span>Child · 3岁</span>指图＋关键词。</div><div class="stage-line"><span>Child · 4-5岁</span>4岁选择1句；5岁尝试2-3句。允许老师轻声提示。</div></div></div></div>`}
function familyDoorGame(){return `<section class="online-game-section" aria-labelledby="familyOnlineGameTitle"><div class="online-game-heading"><div><b>THIS WEEK'S ONLINE GAME · WEEK 1</b><strong id="familyOnlineGameTitle">Family Doorbell</strong></div><span>Tap on a phone · Project in class · About 4 minutes</span></div><div class="online-game-shell" id="familyDoorGame"><div class="family-game-start" id="familyGameStart"><img src="assets/flashcards/family/01-home.webp" alt="A warm family home"><div><small>LISTEN · LOOK · CHOOSE</small><h3>Ding dong!<br>Who's at the door?</h3><p>Listen to the doorbell and the family member. Find mum, dad, sister, brother, grandma and grandpa to collect six Family Stars!</p><div class="game-teacher-note"><b>Teacher tip:</b> Let children listen first. They can point, tap, or say “This is my…” before you move on.</div><button class="family-game-primary" type="button" onclick="startFamilyDoorGame()">Start Game　▶</button></div></div><div class="family-game-play" id="familyGamePlay" hidden><div class="family-game-topbar"><div class="family-game-progress"><span id="familyRoundText">ROUND 1 / 6</span><span class="family-game-stars" id="familyStarText" aria-label="Stars collected"></span></div><button class="family-game-secondary" type="button" onclick="resetFamilyDoorGame()">Restart</button></div><div class="family-game-card"><div class="family-game-prompt"><img src="assets/flashcards/family/01-home.webp" alt="A family member is at the door"><div><small>DING DONG!</small><h4>Who's at the door?</h4><button class="family-listen" type="button" onclick="speakFamilyPrompt()" aria-label="Play the doorbell and character voice again">🔔 Listen Again</button></div></div><div class="family-game-status" id="familyGameStatus" aria-live="polite">Listen and choose the right family member.</div><div class="family-game-options" id="familyGameOptions"></div></div></div><div class="family-game-finish" id="familyGameFinish" hidden><div><div class="finish-stars" aria-label="Six stars">★★★★★★</div><h3>You found<br>my family!</h3><p id="familyFinishText">Amazing! You collected six stars.</p><button class="family-game-primary" type="button" onclick="startFamilyDoorGame()">Play Again　↻</button></div></div><div class="family-confetti" id="familyConfetti" aria-hidden="true"></div></div></section>`}

let coloringState={round:0,score:0,locked:false};
function startColoringGame(){const start=document.getElementById('colorGameStart'),play=document.getElementById('colorGamePlay'),finish=document.getElementById('colorGameFinish');if(!start||!play||!finish)return;coloringState={round:0,score:0,locked:false};start.hidden=true;finish.hidden=true;play.hidden=false;renderColoringRound()}
function renderColoringRound(){const item=coloringRounds[coloringState.round],paper=document.getElementById('colorPaper'),row=document.getElementById('crayonRow'),status=document.getElementById('colorGameStatus'),total=coloringRounds.length;if(!item||!paper||!row||!status)return;coloringState.locked=false;document.querySelector('.color-game-section')?.classList.remove('celebrate');document.getElementById('colorRoundText').textContent=`ROUND ${coloringState.round+1} / ${total}`;document.getElementById('colorStarText').textContent='★'.repeat(coloringState.score)+'☆'.repeat(total-coloringState.score);document.getElementById('colorProgress').style.setProperty('--weekly-progress',`${coloringState.round/total*100}%`);document.getElementById('colorPrompt').textContent=`Make the ${item.animal} ${item.color}!`;paper.innerHTML=colorAnimalPicture(item);status.className='weekly-game-status color-game-status';status.textContent='Which crayon do you need?';const targetCrayon=coloringCrayons.find(([name])=>name===item.color),choices=shuffledFamilyItems([targetCrayon,...shuffledFamilyItems(coloringCrayons.filter(([name])=>name!==item.color)).slice(0,4)]);row.innerHTML=choices.map(([name,hex])=>`<button class="crayon-choice" type="button" style="--crayon:${hex}" aria-label="${name} crayon" onclick="chooseColoringCrayon('${name}',this)"><span class="crayon-tip"></span><span class="crayon-stick">${name.toUpperCase()}</span></button>`).join('')}
function chooseColoringCrayon(color,button){if(coloringState.locked)return;const item=coloringRounds[coloringState.round],status=document.getElementById('colorGameStatus'),total=coloringRounds.length;if(!item||!status)return;if(color!==item.color){button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');status.className='weekly-game-status color-game-status try';status.textContent='Try another crayon!';return}coloringState.locked=true;coloringState.score++;button.classList.add('correct');document.getElementById('colorPaper').innerHTML=colorAnimalPicture(item,true);document.querySelector('.color-game-section')?.classList.add('celebrate');document.getElementById('colorStarText').textContent='★'.repeat(coloringState.score)+'☆'.repeat(total-coloringState.score);document.getElementById('colorProgress').style.setProperty('--weekly-progress',`${coloringState.score/total*100}%`);const isLast=coloringState.round===total-1;status.className='weekly-game-status color-game-status success';status.innerHTML=`<span>✓ A ${item.color} ${item.animal}!</span><button class="weekly-next-button" type="button" onclick="nextColoringRound()">${isLast?'See My Stars':'Next Animal'}　→</button>`;launchSheepPenConfetti()}
function nextColoringRound(){if(!coloringState.locked)return;coloringState.round++;if(coloringState.round<coloringRounds.length)renderColoringRound();else{document.getElementById('colorGamePlay').hidden=true;document.getElementById('colorGameFinish').hidden=false;document.getElementById('colorFinishGallery').innerHTML=coloringRounds.map(item=>colorAnimalPicture(item,true)).join('');launchSheepPenConfetti()}}

function familyVoiceProfile(role){return {mum:{pitch:1.08,rate:.93,names:['Jenny','Aria','Ava','Sonia','Libby','Emma','Zira']},dad:{pitch:.96,rate:.91,names:['Guy','Ryan','Davis','David','Mark','Alex']},brother:{pitch:.98,rate:1.01,names:['Ana','Andrew','Brian','Ryan','Guy','Davis']},sister:{pitch:1.12,rate:1.02,names:['Ana','Jenny','Aria','Ava','Emma','Zira']},grandma:{pitch:1,rate:.88,names:['Sonia','Libby','Jenny','Aria','Ava','Emma']},grandpa:{pitch:.9,rate:.86,names:['Guy','Davis','David','Mark','Alex']}}[role]||{pitch:1.02,rate:.93,names:[]}}
function bestFamilyVoice(role){if(!('speechSynthesis' in window))return null;const voices=window.speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));if(!voices.length)return null;const profile=familyVoiceProfile(role);return [...voices].sort((a,b)=>{const score=v=>{const name=v.name.toLowerCase();let n=0;if(/natural|neural|online/.test(name))n+=40;if(/microsoft|google|apple/.test(name))n+=8;profile.names.forEach((hint,i)=>{if(name.includes(hint.toLowerCase()))n+=30-i});return n};return score(b)-score(a)})[0]}

function renderSheepPenRound(){const round=sheepPenRounds[sheepPenState.round],board=document.getElementById('sheepPenBoard'),status=document.getElementById('sheepPenStatus');if(!round||!board||!status)return;board.querySelectorAll('.pen-sheep').forEach(el=>el.remove());sheepPenState.caught=new Set();sheepPenState.locked=false;document.getElementById('sheepPenRoundText').textContent=`ROUND ${sheepPenState.round+1} / ${sheepPenRounds.length}`;document.getElementById('sheepPenStars').textContent='★'.repeat(sheepPenState.score)+'☆'.repeat(sheepPenRounds.length-sheepPenState.score);document.getElementById('sheepPenProgress').style.setProperty('--weekly-progress',`${sheepPenState.round/sheepPenRounds.length*100}%`);const sign=document.getElementById('sheepPenTarget');sign.textContent=round.label;sign.classList.toggle('word',round.label==='MANY');document.getElementById('sheepPenPrompt').textContent=round.label==='MANY'?'Bring the whole flock!':`Catch ${round.label} sheep!`;status.className='sheep-pen-status';status.textContent=round.label==='MANY'?'Can you bring all the sheep home?':'How many sheep belong in the pen?';for(let id=0;id<8;id++){const button=document.createElement('button');button.type='button';button.className='pen-sheep';button.dataset.sheepId=id;button.draggable=true;button.setAttribute('aria-label',`Sheep ${id+1}. Tap or drag into the pen.`);button.addEventListener('click',()=>togglePenSheep(id));button.addEventListener('dragstart',event=>dragPenSheep(event,id));board.appendChild(button)}positionPenSheep();updateSheepPenCounter()}

function materials(w){const kit=visualKits[w.theme]||[];return `<div class="materials-actions"><button class="materials-print" onclick="window.print()" type="button">打印故事袋与教具准备页</button></div><div class="prep-grid"><div class="prep-card warn wide"><b>识图阶段教具原则</b><strong>正面给孩子看图、角色和实物；背面才给老师写英文提示</strong><p>这一阶段不把认读词卡、文字墙或描写当课堂入口。一个成熟的主题故事袋应包含：教师手偶、角色剪件、场景底板、孩子手持操作件和真实情景物。</p><div class="visual-rule"><div><b>看得懂</b>单一大图、轮廓清楚、背景干净。</div><div><b>拿得住</b>手掌大小、厚卡覆膜、圆角。</div><div><b>动得起来</b>可贴、可放、可藏、可排序。</div><div><b>说得出来</b>道具自然引出动作、选择和角色对话。</div></div></div><div class="prep-card wide"><b>本周主题故事袋 · 五类图像教具</b><div class="visual-kit-grid">${kit.map(x=>`<div class="visual-kit-card"><span class="icon">${x[0]}</span><b>${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div><div class="source-note">教具正面保持图像清楚、背景简洁、没有英文；角色、颜色和场景尽量与本周绘本一致。</div></div><div class="prep-card"><b>必须准备 · 缺一项会影响主任务</b><strong>${w.must}</strong><p>先从机构常备箱取用，再按 Activity 1 / Activity 2 / Final Mission 三篮分装。</p></div><div class="prep-card"><b>可选升级 · 有时间再加</b><strong>${w.nice}</strong><p>提升沉浸感，但不能挤占老师熟悉手偶走位和课堂话术的时间。</p></div><div class="prep-card warn"><b>无教具时的替代方案</b><strong>仍然可以完成课堂</strong><p>${w.substitute}</p></div><div class="prep-card"><b>低成本DIY</b><strong>建议课前一天完成</strong><p>${w.diy}</p></div><div class="prep-card wide"><b>本周完整材料清单</b><p>${w.materials}</p><div class="check-grid">${w.materials.split('、').map(x=>`<label class="check-row"><input type="checkbox">${x}</label>`).join('')}</div><div class="make-steps"><div class="make-step"><span>Step 1</span>先把绘本关键角色和场景列出来。</div><div class="make-step"><span>Step 2</span>做一套老师演示件和每组一套孩子操作件。</div><div class="make-step"><span>Step 3</span>英文只标在背面；正面保持清楚的大图。</div><div class="make-step"><span>Step 4</span>连同绘本、手偶和实物装入本周故事袋。</div></div></div></div>`}
function flashcards(w){const cards=flashcardSets[w.theme]||[];const note=flashcardNotes[w.theme]||'本组闪卡全部使用单一物品、动物、局部或符号，不放人物、故事角色、场景人物或英文单词。';return `<div class="materials-actions"><button class="materials-print" onclick="window.print()" type="button">打印本周无人物闪卡</button></div><div class="prep-card warn wide flashcard-intro"><b>3-5岁闪卡标准</b><strong>正面只有一幅大图 · 不出现人物 · 不要求识字</strong><p>${note}</p><div class="flashcard-rule"><div><b>图像边界</b>允许物品、动物、身体局部、几何形与自然符号；不放成人、儿童、人物脸或商业绘本角色。</div><div><b>制作边界</b>下方图标用于打印试教；正式商业使用时换成课程自有或已授权的同类无人物插图。</div><div><b>使用方法</b>先让孩子看、指、拿、贴或匹配；英语标签只在下方教师提示区查看。</div></div></div><div class="flashcard-sheet">${cards.map((c,n)=>`<div class="flashcard-face" aria-label="flashcard ${n+1}"><span class="flashcard-symbol">${c[0]}</span><span class="flashcard-number">${n+1}</span></div>`).join('')}</div><div class="flashcard-intro"><div class="source-note"><b>教师提示（打印时自动隐藏）：</b>卡面编号只用于备课核对；孩子看正面大图，不看英文。</div><div class="flashcard-key">${cards.map((c,n)=>`<span><b>${n+1}</b>${c[1]}</span>`).join('')}</div></div>`}
function wordwall(w){return `<div class="board"><div class="wordwall-card"><b>Word Match</b><div class="word-tags">${w.words.map(x=>`<span class="word-tag">${x}</span>`).join('')}</div></div><div class="wordwall-card"><b>课堂操作</b><p>白板贴英文词卡，孩子拿图片、实物或自带物品贴到对应词下。Level 1 指认；Level 2 跟说关键词；Level 3 用一小句展示。</p></div></div>`}
function tpr(w){const cues={point:['☝️','手指目标图或实物'],show:['🙌','把教具举到胸前'],hold:['🤲','双手拿稳并停住'],pass:['↔️','双手传给下一位'],stick:['📌','贴到对应场景板'],wave:['👋','看向对方并挥手'],count:['🔢','边点边数，一物一数'],clap:['👏','按数量或节奏拍手'],jump:['⬆️','双脚轻跳到地贴'],put:['📥','把物品放到指定位置'],take:['✋','取出老师指定物品'],stop:['🛑','身体和双手都停住'],find:['🔎','走去找到目标图片'],touch:['👉','轻触指定图片或部位'],tap:['👆','轻拍目标一次'],sort:['🧺','放入对应分类篮'],bring:['📦','找到后带回集合点'],look:['👀','眼睛看向目标'],walk:['👣','沿地贴慢慢走'],fly:['🪽','张开双臂移动'],swim:['🏊','双臂做游泳动作'],roar:['🦁','做动物动作并轻声模仿'],quack:['🦆','手作鸭嘴并模仿'],stomp:['🐾','双脚轮流有力踏地'],bend:['↘️','弯腰或屈膝'],turn:['🔄','原地慢慢转一圈'],eat:['🥄','假装把食物送入口中'],drink:['🥤','双手拿杯做喝水动作'],smell:['👃','靠近后轻轻闻'],give:['🎁','双手递给同伴'],choose:['✅','从两张图中选一张'],make:['🧩','把操作件组合起来'],build:['🧱','一件一件向上搭'],draw:['🖍️','用手在空中画形状'],cut:['✂️','用两指做剪刀动作'],match:['🧩','把相同图片放一起'],share:['🤝','把一件物品给同伴'],roll:['⚽','双手把球沿地面滚出'],drive:['🚗','双手握方向盘移动'],clean:['🧺','把教具放回对应篮'],wait:['⏳','双手放膝盖等待'],open:['📖','双手向两边打开'],close:['📕','双手向中间合上'],go:['➡️','沿路线走向目标'],sit:['🪑','走到位置轻轻坐下'],sleep:['😴','双手合起放在脸旁']};return `<div class="tpr-panel"><div class="tpr-guide"><div><b>本周 TPR</b><strong>先听懂，再行动，最后自然跟说</strong></div><p>一次只给一个短指令；老师完整示范一遍，孩子先用动作回应，不强求立即开口。</p></div><div class="tpr-action-grid">${w.tpr.map((x,n)=>{const c=cues[x]||['✨','老师示范，孩子跟做'];return `<div class="tpr-action"><span class="tpr-action-icon">${c[0]}</span><div><small>ACTION ${n+1}</small><strong>${x}</strong><p>${c[1]}</p></div></div>`}).join('')}</div><div class="tpr-run"><div><span>1</span><b>Teacher says</b><p>老师说指令并完成动作。</p></div><div><span>2</span><b>Children do</b><p>孩子只用动作回应也算成功。</p></div><div><span>3</span><b>Say &amp; lead</b><p>熟悉后跟说，再邀请孩子带一次。</p></div></div></div>`}
function bridge(w){return `<div class="bridge-grid"><div class="bridge-card"><b>家庭输入证据</b><ul class="list"><li>孩子已听：${w.song}</li><li>孩子已看/读：${w.reading}</li><li>孩子带来：${w.bring}</li></ul></div><div class="bridge-card"><b>课堂升级</b><p>家庭端负责熟悉输入；课堂端负责真实使用、游戏互动和小舞台成果。</p></div><div class="bridge-card"><b>给家长看的反馈语言</b><p>今天孩子不是重新学一遍，而是把本周在家听过、看过的内容，用在了课堂游戏和展示里。</p></div><div class="bridge-card"><b>回家延伸</b><p>只复习课堂中最稳的一句话或一个游戏，不额外加压。</p></div></div>`}
function feedback(w,i){return `<div class="feedback-actions"><button class="feedback-print" onclick="window.print()" type="button">打印反馈表</button></div><div class="feedback-grid"><div class="feedback-brand"><img class="feedback-logo" src="logo.webp" alt="DANIEL’S STUDIO 蛋妞英语工作室 Logo"><div><strong>蛋妞英语课堂成长反馈</strong><span>看见孩子每一次理解、参与与表达</span></div><div class="feedback-week">Week ${i+1} · ${w.theme}</div></div><div class="feedback-card"><b>学生姓名 / 日期</b><input placeholder="手动填写"></div><div class="feedback-card"><b>主题</b><p>Week ${i+1} · ${w.theme}<br>成果：${w.tag}</p></div><div class="feedback-card"><b>课堂参与</b><select><option>主动参与，愿意上台</option><option>能跟随老师参与活动</option><option>需要老师多次邀请</option><option>今天以观察和适应为主</option></select></div><div class="feedback-card"><b>听懂指令</b><select><option>能听懂并完成主要TPR指令</option><option>能在示范后完成指令</option><option>需要同伴或老师辅助</option><option>暂时以动作模仿为主</option></select></div><div class="feedback-card"><b>英语表达</b><select><option>能独立说出目标短句</option><option>能跟说目标短句</option><option>能说关键词</option><option>以指认/选择/动作为主要输出</option></select></div><div class="feedback-card"><b>小舞台展示</b><select><option>完成展示，可作为本周成果视频</option><option>部分完成，已能稳定输出一句</option><option>愿意上台，但需要老师辅助</option><option>本周先不强拍，继续建立安全感</option></select></div><div class="feedback-card"><b>老师手写反馈</b><textarea>今天孩子在 ${w.tag} 中完成了：________________。最明显的进步是：________________。下一步建议：________________。</textarea></div><div class="feedback-card"><b>回家建议</b><textarea>回家继续用本周素材做一次轻量复习：________________。</textarea></div></div>`}

flashcards=function(w){const [folder,labels]=flashcardArt[w.theme];const note=flashcardNotes[w.theme]||'本组闪卡采用儿童绘本插画：纯白背景、单一大主体、无文字。';const artStyle=w.theme==='Body'?'柔和手绘效果 · 白色背景 · 大图宽留白':'儿童绘本插画 · 白色背景 · 大图宽留白';const cards=labels.map((label,n)=>({label,display:flashcardDisplayOverrides[w.theme]?.[label]||label.replaceAll('-',' '),src:`assets/flashcards/${folder}/${String(n+1).padStart(2,'0')}-${label}.webp`}));let pages='';for(let i=0;i<cards.length;i+=2){const pair=cards.slice(i,i+2);pages+=`<section class="flashcard-print-page">${pair.map(c=>`<div class="generated-flashcard"><img src="${c.src}" alt="${c.display} flashcard"></div>`).join('')}<div class="flashcard-page-label">${w.theme} · Page ${i/2+1}</div></section>`}const visualRule=w.theme==='My Family'||w.theme==='Body'?'人物仅在绘本内容确有需要时出现；不叠加英文单词和编号。':'卡面只有一幅清晰大图，不出现人物、英文单词和编号。';return `<div class="materials-actions"><button class="materials-print" onclick="window.print()" type="button">打印闪卡</button></div><div class="prep-card warn wide flashcard-intro"><b>本周绘本配套闪卡</b><strong>${artStyle}</strong><p>${note}</p><div class="flashcard-rule"><div><b>孩子看到</b>${visualRule}</div><div><b>打印规格</b>A4纵向，每页两张大卡；沿浅色虚线裁切后可覆膜。</div><div><b>老师使用</b>先看、指、拿、贴和配对，再引出口语，不把识字作为入口。</div></div></div>${pages}<div class="flashcard-intro"><div class="source-note"><b>闪卡顺序：</b>请按下方英文名称核对图片，课堂中不向孩子展示文字。</div><div class="generated-key">${cards.map((c,n)=>`<span><b>${n+1}</b>${c.display}</span>`).join('')}</div></div>`};

'Emotions':'起床、放学或睡前轻声问：“How do you feel?” 孩子可以指表情、做动作，或说：“I feel happy / tired.” 家长回应：“I hear you. / It’s okay.”',

'Transportation':'上学、出门或看到车辆时问：“How do we go?” 孩子可以指着真实车辆说：“I go by bus / car.” 路上再找一种不同的交通工具。'
};
function applyFeedbackTemplate(select){const w=weeks[current],target=document.getElementById('teacherFeedbackText'),topic=`${w.cn}主题活动`;if(!target)return;const templates={active:`今天孩子在“${topic}”中积极参与，能够主动尝试本周词汇和句型。最明显的进步是：________________。下一步我们会继续鼓励孩子把语言用在真实互动中。`,steady:`今天孩子能够跟随老师参与“${topic}”，并通过动作、指认或语言完成主要任务。最明显的进步是：________________。下一步我们会继续支持孩子使用本周句型自然表达。`,observe:`今天孩子主要通过观察、动作和选择参与“${topic}”，已经开始熟悉本周词汇与课堂流程。下一步我们会给予更多等待时间和轻声提示，帮助孩子逐渐开口。`};if(select.value==='custom'){target.focus();return}target.value=templates[select.value]||templates.steady}

speakFamilyText=function(text,role='family'){
 const consent=window.lessonAudio.capture();

emotionFaceGame=function(){return emotionFaceGamePolishBase().replace('Choose from five silly eyes, five noses and five mouths. Build one big, exaggerated feeling face and say how he feels.','Choose from five expressive eyes and five mouths. The nose stays simple so every feeling is easy to read.').replace('Choose the eyes, nose and mouth.','Choose the eyes and mouth.')};
const renderFaceBuilderRoundPolishBase=renderFaceBuilderRound;
renderFaceBuilderRound=function(){renderFaceBuilderRoundPolishBase();for(const part of ['Eyes','Nose','Mouth']){const el=document.getElementById(`placed${part}`);el.style.backgroundImage=`url('${facePartImages[part.toLowerCase()]}')`;el.style.backgroundSize='';el.style.backgroundPosition='0% center'}placedNose.classList.add('show');faceBuilderState.placed.add('nose');faceBuilderStatus.textContent='Choose the eyes and mouth.'};
const chooseFacePartPolishBase=chooseFacePart;
chooseFacePart=function(part,emotion,button){const target=faceBuilderState.deck[faceBuilderState.round];chooseFacePartPolishBase(part,emotion,button);if(emotion!==target)return;const slot=document.getElementById(`placed${part[0].toUpperCase()+part.slice(1)}`);if(emotion==='excited'&&part==='eyes'){slot.style.backgroundImage="url('assets/games/emotions/excited-eyes-clean.webp')";slot.style.backgroundSize='contain';slot.style.backgroundPosition='center'}else if(emotion==='excited'&&part==='mouth'){slot.style.backgroundImage="url('assets/games/emotions/mouths-strip.webp')";slot.style.backgroundSize='500% auto';slot.style.backgroundPosition='0% center'}else if(emotion==='angry'&&part==='mouth'){slot.style.backgroundPosition='52% center'}if(document.activeElement instanceof HTMLElement)document.activeElement.blur()};
renderToyMagicRound=function(){toyMagicState.peek=0;toyMagicState.locked=false;const target=toyMagicState.deck[toyMagicState.round],others=shuffledFamilyItems(toyMagicItems.filter(x=>x[0]!==target[0])).slice(0,2);toyMagicRound.textContent=`TRICK ${toyMagicState.round+1} / 8`;toyMagicStars.textContent='★'.repeat(toyMagicState.score)+'☆'.repeat(8-toyMagicState.score);toyMagicPrompt.textContent='What is hiding?';magicPeekToy.src=target[1];magicPeekToy.className='magic-peek-toy';magicPeekToy.style.setProperty('--peek','11%');toyMagicOptions.innerHTML=shuffledFamilyItems([target,...others]).map(x=>`<button class="toy-magic-option" onclick="guessMagicToy('${x[0]}',this)"><img src="${x[1]}" alt="${x[0]}"></button>`).join('');toyMagicStatus.className='weekly-game-status novel-status';toyMagicStatus.textContent='Look at the little piece above the hat. What could it be?';speakFamilyText('Look closely. What is hiding in the magic hat?','sister')};
showToyClue=function(){if(toyMagicState.locked)return;toyMagicState.peek=Math.min(2,toyMagicState.peek+1);magicPeekToy.style.setProperty('--peek',`${[11,18,27][toyMagicState.peek]}%`);toyMagicStatus.textContent=toyMagicState.peek===2?'One last clue. What toy is it?':'Here is a little more. Can you guess?'};
guessMagicToy=function(name,button){if(toyMagicState.locked)return;const target=toyMagicState.deck[toyMagicState.round];if(name!==target[0]){button.classList.add('wrong');toyMagicStatus.textContent='Not quite. Look at the clue and try again!';speakFamilyText('Not quite. Try again!','sister');return}toyMagicState.locked=true;toyMagicState.score++;button.classList.add('correct');magicPeekToy.classList.add('revealed');toyMagicStars.textContent='★'.repeat(toyMagicState.score)+'☆'.repeat(8-toyMagicState.score);const plural=name==='blocks',article=/^(a|e|i|o|u)/.test(name)?'an':'a',answer=plural?'They are blocks!':`It's ${article} ${name}!`;toyMagicStatus.className='weekly-game-status novel-status success';toyMagicStatus.innerHTML=`<span>Wow! You found it — ${answer}</span><button class="weekly-next-button" onclick="nextToyMagicRound()">${toyMagicState.round===7?'See My Stars':'Next Trick'}　→</button>`;speakFamilyText(`Wow, you found it! ${answer}`,'sister')};
drawSlots();

<span id="audioRuntimeStatus" hidden>pending</span>
<script id="singleAudioChannelLogic">
(()=>{
 try{
  const nativeSetTimeout=window.setTimeout.bind(window);
  let pendingPromptTimer=0;
  let voiceEnabled=false;
  const audioStatus=document.getElementById('audioRuntimeStatus');
  const promptNames=new Set([
    'speakMagicBalloonPrompt','speakShapeSpacePrompt','speakFamilyPhotoPrompt','speakFamilyPrompt',
    'speakWeeklyPrompt','speakBodyGigglePrompt','speakEmotionStickerPrompt','speakSandwichPrompt',
    'speakHomeHidePrompt','speakFaceBuilderPrompt'
  ]);
  window.setTimeout=function(handler,delay,...args){
    if(typeof handler==='function'&&promptNames.has(handler.name)){
      if(pendingPromptTimer)window.clearTimeout(pendingPromptTimer);
      pendingPromptTimer=nativeSetTimeout(()=>{pendingPromptTimer=0;handler(...args)},Math.max(Number(delay)||0,520));
      return pendingPromptTimer;
    }
    return nativeSetTimeout(handler,delay,...args);
  };
  const singleChannelSpeakBase=speakFamilyText;
  speakFamilyText=function(text,role='family'){
    if(pendingPromptTimer){window.clearTimeout(pendingPromptTimer);pendingPromptTimer=0}
    familyPromptToken++;
    if(familyDoorbellAudio){familyDoorbellAudio.pause();familyDoorbellAudio.currentTime=0}
    if(!voiceEnabled){audioStatus.textContent='ready-muted';return}
    audioStatus.textContent=`playing:${text}`;
    return singleChannelSpeakBase(text,role);
  };
  const stopAllVoice=()=>{
    if(pendingPromptTimer){window.clearTimeout(pendingPromptTimer);pendingPromptTimer=0}
    familyPromptToken++;
    window.speechSynthesis?.cancel();
    if(naturalVoiceAudio){naturalVoiceAudio.pause();naturalVoiceAudio.currentTime=0;naturalVoiceAudio=null}
    if(familyDoorbellAudio){familyDoorbellAudio.pause();familyDoorbellAudio.currentTime=0}
    audioStatus.textContent=voiceEnabled?'ready':'ready-muted';
  };
  const intentionalGameAction=target=>target instanceof Element&&Boolean(target.closest('.weekly-game-section,.online-game-section'));
  const setVoiceIntent=event=>{
    stopAllVoice();
    voiceEnabled=Boolean(event.isTrusted&&intentionalGameAction(event.target));
    audioStatus.textContent=voiceEnabled?'ready':'ready-muted';
  };
  document.addEventListener('pointerdown',setVoiceIntent,true);
  document.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '||event.key==='Spacebar')setVoiceIntent(event);
  },true);
  document.addEventListener('dragstart',setVoiceIntent,true);
  window.addEventListener('pageshow',()=>{voiceEnabled=false;stopAllVoice()});
  window.addEventListener('pagehide',()=>{voiceEnabled=false;stopAllVoice()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){voiceEnabled=false;stopAllVoice()}});

  // The family-door prompt starts with a doorbell before speaking, so guard it too.
  const singleChannelFamilyPromptBase=speakFamilyPrompt;
  speakFamilyPrompt=function(){if(!voiceEnabled){audioStatus.textContent='ready-muted';return}return singleChannelFamilyPromptBase()};

  // The older monster handler spoke a short line and then a second reaction.
  // Keep the same visual response but play exactly one natural reaction.
  chooseGigglePart=function(part){
    const scoreBefore=bodyGiggleState.score;
    const target=bodyGiggleParts[bodyGiggleState.round];
    const speaking=speakFamilyText;
    speakFamilyText=()=>{};
    try{chooseGigglePartNaturalBase(part)}finally{speakFamilyText=speaking}
    if(bodyGiggleState.score>scoreBefore){
      if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
      speaking(monsterReactionLines[part]||`That tickles! My ${part}!`,'sister');
    }else if(part!==target){
      speaking(`Try again. Find the ${target}.`,'sister');
    }
  };
  window.__singleAudioChannel={stop:stopAllVoice,get pending(){return Boolean(pendingPromptTimer)},get enabled(){return voiceEnabled}};
  document.documentElement.dataset.singleAudio='ready';
  audioStatus.textContent='ready-muted';
 }catch(error){document.documentElement.dataset.singleAudio=`error:${error.message}`;document.getElementById('audioRuntimeStatus').textContent=`error:${error.message}`}
})();
</script>
<script>
(()=>{
  const isEditable=target=>target instanceof Element&&Boolean(target.closest('input,textarea,select,[contenteditable="true"]'));
  const normalizeEnglishApostrophes=root=>{const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const node=walker.currentNode;if(node.parentElement?.closest('script,style'))continue;node.nodeValue=node.nodeValue.replace(/([A-Za-z])\u2019(?=[A-Za-z])/g,"$1'")}};
  normalizeEnglishApostrophes(document.body);
  new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===Node.TEXT_NODE){node.nodeValue=node.nodeValue.replace(/([A-Za-z])\u2019(?=[A-Za-z])/g,"$1'")}else if(node.nodeType===Node.ELEMENT_NODE)normalizeEnglishApostrophes(node)}))).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('contextmenu',event=>{if(!isEditable(event.target))event.preventDefault()});
  document.addEventListener('copy',event=>{if(!isEditable(event.target))event.preventDefault()});
  document.addEventListener('cut',event=>{if(!isEditable(event.target))event.preventDefault()});
  document.addEventListener('dragstart',event=>{if(event.target instanceof HTMLImageElement)event.preventDefault()});
  document.addEventListener('keydown',event=>{
    const key=event.key.toLowerCase();
    const primary=event.ctrlKey||event.metaKey;
    const blocked=event.key==='F12'||(primary&&(key==='u'||key==='s'))||(primary&&event.shiftKey&&['i','j','c'].includes(key));
    if(blocked){event.preventDefault();event.stopPropagation()}
  },true);
})();
</script>
